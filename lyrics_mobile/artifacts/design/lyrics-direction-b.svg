<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 1360 1360"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect x="0" y="0" width="1360" height="1360" fill="#20231e" rx="0" stroke="none"/><text x="40" y="44" font-size="27" fill="#eeeee7" font-weight="750">Lyrics Mobile / 디자인 제안 B</text><text x="40" y="75" font-size="16" fill="#b0b5a7" font-weight="400">미적용 시안 · 앨범 중심 구성 + 차콜 배경 + 라임 포인트</text><g transform="translate(40 110)"><rect x="0" y="0" width="390" height="790" fill="#10110f" rx="16" stroke="#34382e"/><text x="24" y="30" font-size="13" fill="#eeeee7" font-weight="600">9:41</text><text x="323" y="30" font-size="14" fill="#eeeee7" font-weight="400">•••</text><text x="24" y="88" font-size="32" fill="#eeeee7" font-weight="800">음악 찾기</text><text x="24" y="119" font-size="15" fill="#b0b5a7" font-weight="400">지금 듣는 곡, 바로 펼쳐봐.</text><circle cx="195" cy="249" r="95" fill="#dfff62"/><path d="M167 240v20m14-43v66m14-81v96m14-67v38m14-18v10" stroke="#10110f" stroke-width="6" stroke-linecap="round"/><text x="122" y="378" font-size="20" fill="#eeeee7" font-weight="700">재생 곡 찾기</text><text x="94" y="405" font-size="12" fill="#b0b5a7" font-weight="400">주변 소리 대신 플레이어 정보를 확인해요</text><rect x="24" y="438" width="342" height="52" fill="#1c1e19" rx="8" stroke="none"/><text x="42" y="471" font-size="15" fill="#b0b5a7" font-weight="400">노래 또는 아티스트 검색</text><text x="331" y="471" font-size="23" fill="#dfff62" font-weight="400">⌕</text><text x="24" y="541" font-size="18" fill="#eeeee7" font-weight="700">다시 펼쳐보기</text><g transform="translate(24 563) scale(0.76)"><rect x="0" y="0" width="100" height="100" fill="#ff784b" rx="4" stroke="none"/><path d="M0 73L37 0H63L10 100H0M38 100L91 0H100V24L62 100Z" fill="#3b241d"/><circle cx="61" cy="52" r="20" fill="none" stroke="#f8d9b6" stroke-width="2"/></g><text x="116" y="589" font-size="22" fill="#eeeee7" font-weight="700">灯火</text><text x="116" y="616" font-size="13" fill="#b0b5a7" font-weight="400">Vaundy · 원문 저장됨</text><text x="344" y="608" font-size="24" fill="#dfff62" font-weight="400">↗</text><text x="24" y="687" font-size="13" fill="#b0b5a7" font-weight="400">주변 음악 인식 · 연결 준비 중</text><path d="M24 725H366" stroke="#34382e"/><text x="34" y="762" font-size="14" fill="#dfff62" font-weight="700">찾기</text><text x="142" y="762" font-size="14" fill="#b0b5a7" font-weight="400">보관함</text><text x="280" y="762" font-size="14" fill="#b0b5a7" font-weight="400">설정</text></g><g transform="translate(485 110)"><rect x="0" y="0" width="390" height="790" fill="#10110f" rx="16" stroke="#34382e"/><text x="24" y="30" font-size="13" fill="#eeeee7" font-weight="600">9:41</text><text x="323" y="30" font-size="14" fill="#eeeee7" font-weight="400">•••</text><text x="24" y="87" font-size="32" fill="#eeeee7" font-weight="800">곡 선택</text><rect x="24" y="109" width="342" height="52" fill="#1c1e19" rx="8" stroke="none"/><text x="40" y="143" font-size="18" fill="#eeeee7" font-weight="400">tomoshibi</text><text x="330" y="144" font-size="22" fill="#b0b5a7" font-weight="400">×</text><text x="24" y="201" font-size="13" fill="#dfff62" font-weight="700">원제 일치 후보</text><rect x="16" y="220" width="358" height="125" fill="#252b1d" rx="8" stroke="none"/><g transform="translate(28 235) scale(0.88)"><rect x="0" y="0" width="100" height="100" fill="#ff784b" rx="4" stroke="none"/><path d="M0 73L37 0H63L10 100H0M38 100L91 0H100V24L62 100Z" fill="#3b241d"/><circle cx="61" cy="52" r="20" fill="none" stroke="#f8d9b6" stroke-width="2"/></g><text x="134" y="266" font-size="25" fill="#eeeee7" font-weight="800">灯火</text><text x="134" y="294" font-size="16" fill="#eeeee7" font-weight="400">Vaundy</text><text x="134" y="322" font-size="13" fill="#b0b5a7" font-weight="400">strobo · 2:59</text><text x="344" y="287" font-size="22" fill="#dfff62" font-weight="400">↗</text><text x="24" y="399" font-size="14" fill="#b0b5a7" font-weight="400">다른 가수의 동명곡</text><g transform="translate(24 423) scale(0.65)"><rect x="0" y="0" width="100" height="100" fill="#90b9ed" rx="4" stroke="none"/><path d="M0 73L37 0H63L10 100H0M38 100L91 0H100V24L62 100Z" fill="#273a6b"/><circle cx="61" cy="52" r="20" fill="none" stroke="#d3ff60" stroke-width="2"/></g><text x="108" y="447" font-size="20" fill="#eeeee7" font-weight="650">Tomoshibi</text><text x="108" y="476" font-size="13" fill="#b0b5a7" font-weight="400">다른 아티스트 · 3:42</text><path d="M24 515H366" stroke="#34382e"/><text x="24" y="568" font-size="15" fill="#eeeee7" font-weight="600">곡이 맞는지 한 번 더 확인해요.</text><text x="24" y="596" font-size="13" fill="#b0b5a7" font-weight="400">원문 제공 여부는 선택 후 확인합니다.</text><path d="M24 725H366" stroke="#34382e"/><text x="34" y="762" font-size="14" fill="#dfff62" font-weight="700">찾기</text><text x="142" y="762" font-size="14" fill="#b0b5a7" font-weight="400">보관함</text><text x="280" y="762" font-size="14" fill="#b0b5a7" font-weight="400">설정</text></g><g transform="translate(930 110)"><rect x="0" y="0" width="390" height="790" fill="#10110f" rx="16" stroke="#34382e"/><text x="24" y="30" font-size="13" fill="#eeeee7" font-weight="600">9:41</text><text x="323" y="30" font-size="14" fill="#eeeee7" font-weight="400">•••</text><g transform="translate(24 60) scale(0.72)"><rect x="0" y="0" width="100" height="100" fill="#ff784b" rx="4" stroke="none"/><path d="M0 73L37 0H63L10 100H0M38 100L91 0H100V24L62 100Z" fill="#3b241d"/><circle cx="61" cy="52" r="20" fill="none" stroke="#f8d9b6" stroke-width="2"/></g><text x="116" y="85" font-size="27" fill="#eeeee7" font-weight="800">灯火</text><text x="116" y="112" font-size="14" fill="#b0b5a7" font-weight="400">Vaundy · 2:59</text><text x="341" y="89" font-size="23" fill="#eeeee7" font-weight="400">···</text><text x="24" y="180" font-size="15" fill="#dfff62" font-weight="700">함께</text><text x="105" y="180" font-size="15" fill="#b0b5a7" font-weight="400">원본</text><text x="190" y="180" font-size="15" fill="#b0b5a7" font-weight="400">번역</text><text x="280" y="180" font-size="15" fill="#b0b5a7" font-weight="400">발음</text><path d="M24 199H366" stroke="#34382e"/><path d="M24 199H59" stroke="#dfff62" stroke-width="3"/><text x="24" y="234" font-size="12" fill="#b0b5a7" font-weight="400">일본어 원문 · LRCLIB</text><rect x="24" y="254" width="342" height="64" fill="#1c1e19" rx="8" stroke="none"/><text x="38" y="279" font-size="13" fill="#b0b5a7" font-weight="400">번역은 아직 만들지 않았어요</text><text x="38" y="302" font-size="14" fill="#dfff62" font-weight="700">번역 만들기  ↗</text><text x="24" y="381" font-size="29" fill="#eeeee7" font-weight="700">音楽を楽しむ</text><text x="24" y="413" font-size="14" fill="#b0b5a7" font-weight="400">가사는 원문부터, 번역은 선택 후.</text><text x="24" y="493" font-size="28" fill="#eeeee7" font-weight="700">言葉をゆっくり読む</text><text x="24" y="526" font-size="12" fill="#b0b5a7" font-weight="400">색으로 강조하되 자동 싱크로 오해하지 않게</text><text x="24" y="606" font-size="26" fill="#eeeee7" font-weight="650">今日の音を覚えている</text><path d="M24 687H366" stroke="#34382e"/><text x="24" y="721" font-size="14" fill="#eeeee7" font-weight="600">Aa  읽기 설정</text><text x="246" y="721" font-size="14" fill="#b0b5a7" font-weight="400">원문 정보</text><text x="24" y="759" font-size="12" fill="#b0b5a7" font-weight="400">시안용 문장 · 실제 곡 가사가 아닙니다</text></g><text x="40" y="961" font-size="28" fill="#eeeee7" font-weight="750">더 음악답게, 읽기는 더 명확하게.</text><text x="40" y="1000" font-size="17" fill="#b0b5a7" font-weight="400">색은 액션에, 이미지는 곡에, 여백은 가사에 사용합니다.</text><rect x="40" y="1050" width="35" height="35" fill="#10110f" rx="4" stroke="none"/><text x="90" y="1075" font-size="16" fill="#eeeee7" font-weight="400">차콜</text><rect x="260" y="1050" width="35" height="35" fill="#dfff62" rx="4" stroke="none"/><text x="310" y="1075" font-size="16" fill="#eeeee7" font-weight="400">라임 / 주요 액션</text><rect x="595" y="1050" width="35" height="35" fill="#ff784b" rx="4" stroke="none"/><text x="645" y="1075" font-size="16" fill="#eeeee7" font-weight="400">앨범별 포인트 색</text><text x="40" y="1148" font-size="15" fill="#b0b5a7" font-weight="400">참고: Spotify의 곡 정보·아트 중심 구성, Apple Music의 앨범 색 기반 몰입감.</text><text x="40" y="1180" font-size="15" fill="#b0b5a7" font-weight="400">로고·실제 앨범 이미지를 복제하지 않았습니다. 아트는 시안용 그래픽입니다.</text><text x="40" y="1230" font-size="16" fill="#dfff62" font-weight="600">앱 전체 색상 교체는 이 방향을 확인받은 뒤 진행합니다.</text></svg>