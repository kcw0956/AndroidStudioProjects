<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 1360 1360"><style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif}</style><rect x="0" y="0" width="1360" height="1360" fill="#f0f0ec" rx="0" stroke="none"/><text x="40" y="42" font-size="25" fill="#242723" font-weight="700">Lyrics Mobile / 디자인 제안 A</text><text x="40" y="69" font-size="14" fill="#656b63" font-weight="400">미적용 시안 · Material 3의 정보 위계와 ivLyrics의 가사 중심 구성을 참고</text><g transform="translate(40 100)"><rect x="0" y="0" width="390" height="790" fill="#fafaf9" rx="16" stroke="#dddfd8"/><text x="24" y="30" font-size="13" fill="#242723" font-weight="600">9:41</text><text x="320" y="30" font-size="14" fill="#242723" font-weight="400">•••</text><text x="24" y="85" font-size="28" fill="#242723" font-weight="700">음악 찾기</text><text x="24" y="114" font-size="15" fill="#656b63" font-weight="400">지금 듣는 노래에서, 가사로.</text><circle cx="195" cy="240" r="91" fill="#315b4a"/><path d="M176 222v36m12-55v74m12-90v106m12-76v46m12-32v18" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="123" y="361" font-size="18" fill="#242723" font-weight="650">재생 중인 곡 찾기</text><text x="104" y="389" font-size="13" fill="#656b63" font-weight="400">플레이어의 곡 정보를 가져와요</text><rect x="24" y="424" width="342" height="52" fill="#eff0eb" rx="8" stroke="none"/><text x="43" y="456" font-size="15" fill="#656b63" font-weight="400">노래 제목 또는 아티스트</text><text x="330" y="456" font-size="24" fill="#315b4a" font-weight="400">⌕</text><text x="24" y="526" font-size="18" fill="#242723" font-weight="700">최근에 펼친 가사</text><g transform="translate(24 550)"><rect x="0" y="0" width="56" height="56" fill="#b9c7b6" rx="6" stroke="none"/><path d="M0 48L20 12L38 48L56 25V56H0Z" fill="#496855"/><circle cx="42" cy="13" r="6" fill="#f1e8d6"/></g><text x="94" y="575" font-size="18" fill="#242723" font-weight="600">灯火</text><text x="94" y="598" font-size="13" fill="#656b63" font-weight="400">Vaundy · 저장된 원문</text><path d="M24 626H366" stroke="#dddfd8"/><text x="24" y="659" font-size="15" fill="#242723" font-weight="400">주변 음악 인식</text><text x="24" y="682" font-size="13" fill="#656b63" font-weight="400">아직 연결되지 않았어요</text><path d="M24 726H366" stroke="#dddfd8"/><text x="45" y="763" font-size="14" fill="#315b4a" font-weight="700">찾기</text><text x="151" y="763" font-size="14" fill="#656b63" font-weight="400">보관함</text><text x="282" y="763" font-size="14" fill="#656b63" font-weight="400">설정</text></g><g transform="translate(485 100)"><rect x="0" y="0" width="390" height="790" fill="#fafaf9" rx="16" stroke="#dddfd8"/><text x="24" y="30" font-size="13" fill="#242723" font-weight="600">9:41</text><text x="320" y="30" font-size="14" fill="#242723" font-weight="400">•••</text><text x="24" y="85" font-size="28" fill="#242723" font-weight="700">곡 선택</text><rect x="24" y="107" width="342" height="50" fill="#eff0eb" rx="8" stroke="none"/><text x="40" y="139" font-size="17" fill="#242723" font-weight="400">tomoshibi</text><text x="24" y="191" font-size="14" fill="#656b63" font-weight="400">제목과 가수가 맞는 곡을 선택하세요</text><text x="24" y="231" font-size="13" fill="#315b4a" font-weight="600">원제 일치</text><g transform="translate(24 252)"><rect x="0" y="0" width="56" height="56" fill="#b9c7b6" rx="6" stroke="none"/><path d="M0 48L20 12L38 48L56 25V56H0Z" fill="#496855"/><circle cx="42" cy="13" r="6" fill="#f1e8d6"/></g><text x="94" y="274" font-size="20" fill="#242723" font-weight="700">灯火</text><text x="94" y="299" font-size="15" fill="#242723" font-weight="400">Vaundy</text><text x="94" y="324" font-size="13" fill="#656b63" font-weight="400">strobo · 2:59</text><text x="343" y="290" font-size="25" fill="#315b4a" font-weight="400">›</text><path d="M24 348H366" stroke="#dddfd8"/><text x="24" y="395" font-size="14" fill="#656b63" font-weight="600">다른 가수의 동명곡</text><g transform="translate(24 418)"><rect x="0" y="0" width="56" height="56" fill="#e2b893" rx="6" stroke="none"/><path d="M0 48L20 12L38 48L56 25V56H0Z" fill="#936e4b"/><circle cx="42" cy="13" r="6" fill="#f1e8d6"/></g><text x="94" y="444" font-size="18" fill="#242723" font-weight="600">Tomoshibi</text><text x="94" y="469" font-size="13" fill="#656b63" font-weight="400">다른 아티스트 · 3:42</text><path d="M24 495H366" stroke="#dddfd8"/><text x="24" y="548" font-size="14" fill="#656b63" font-weight="400">곡 목록과 가사 제공 여부는 달라요</text><text x="24" y="573" font-size="14" fill="#656b63" font-weight="400">선택한 뒤 원문을 확인합니다.</text><path d="M24 726H366" stroke="#dddfd8"/><text x="45" y="763" font-size="14" fill="#315b4a" font-weight="700">찾기</text><text x="151" y="763" font-size="14" fill="#656b63" font-weight="400">보관함</text><text x="282" y="763" font-size="14" fill="#656b63" font-weight="400">설정</text></g><g transform="translate(930 100)"><rect x="0" y="0" width="390" height="790" fill="#fafaf9" rx="16" stroke="#dddfd8"/><text x="24" y="30" font-size="13" fill="#242723" font-weight="600">9:41</text><text x="320" y="30" font-size="14" fill="#242723" font-weight="400">•••</text><text x="24" y="79" font-size="27" fill="#242723" font-weight="400">‹</text><text x="59" y="79" font-size="22" fill="#242723" font-weight="700">灯火</text><text x="59" y="104" font-size="13" fill="#656b63" font-weight="400">Vaundy · 2:59</text><text x="335" y="83" font-size="24" fill="#242723" font-weight="400">···</text><text x="24" y="158" font-size="15" fill="#315b4a" font-weight="700">함께</text><text x="106" y="158" font-size="15" fill="#656b63" font-weight="400">원본</text><text x="191" y="158" font-size="15" fill="#656b63" font-weight="400">번역</text><text x="278" y="158" font-size="15" fill="#656b63" font-weight="400">발음</text><path d="M24 174H59" stroke="#315b4a" stroke-width="3"/><path d="M24 181H366" stroke="#dddfd8"/><text x="24" y="212" font-size="12" fill="#656b63" font-weight="400">일본어 원문 · LRCLIB</text><rect x="24" y="235" width="342" height="72" fill="#edf1eb" rx="8" stroke="none"/><text x="39" y="260" font-size="14" fill="#242723" font-weight="400">번역은 아직 생성하지 않았어요</text><text x="39" y="288" font-size="14" fill="#315b4a" font-weight="700">번역 만들기  →</text><text x="24" y="363" font-size="27" fill="#242723" font-weight="600">音楽を楽しむ</text><text x="24" y="395" font-size="13" fill="#656b63" font-weight="400">시안용 예시 문장</text><text x="24" y="463" font-size="27" fill="#242723" font-weight="600">言葉をゆっくり読む</text><text x="24" y="495" font-size="13" fill="#656b63" font-weight="400">실제 곡의 가사가 아닙니다</text><text x="24" y="563" font-size="27" fill="#242723" font-weight="600">今日の音を覚えている</text><path d="M24 687H366" stroke="#dddfd8"/><text x="24" y="720" font-size="14" fill="#242723" font-weight="600">Aa  읽기 설정</text><text x="242" y="720" font-size="14" fill="#656b63" font-weight="400">원문 정보</text><text x="24" y="759" font-size="12" fill="#656b63" font-weight="400">스크롤 영역은 본문 하나만 사용</text></g><text x="40" y="924" font-size="15" fill="#656b63" font-weight="400">방향: 차분한 녹색 · 가벼운 목록 · 작은 탭 · 생성 전 명시적인 선택</text></svg>